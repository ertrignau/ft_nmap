name: ft-nmap-lab

x-target-common: &target-common
  image: ft-nmap-lab-target:local
  build:
    context: ./target
  cap_add:
    - NET_ADMIN
    - NET_RAW
  restart: "no"

services:
  target-10:
    <<: *target-common
    container_name: ft_nmap_target_10
    env_file:
      - ./configs/target-10.env
    profiles:
      - "full"
      - "fleet"
      - "ipv6"
    networks:
      net-a:
        ipv4_address: 172.28.0.10
        ipv6_address: fd42:28::10

  target-11:
    <<: *target-common
    container_name: ft_nmap_target_11
